name: montas_organizer
description: Standalone MONTAS event organizer and partnerships prototype.
publish_to: none
version: 0.2.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  web: ^1.1.1
  flutter_svg: ^2.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/events/
    - assets/brand/mark.svg
    - assets/brand/OFL.txt
  fonts:
    - family: Onest
      fonts:
        - asset: assets/Onest.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/brand/PlusJakartaSans.ttf
